name: test_python

on: [pull_request, push]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.owner.login != github.event.pull_request.base.repo.owner.login
    strategy:
      matrix:
        python: ['3.9', '3.10', '3.11', '3.12', '3.13', '3.14', '3.15']
    runs-on: ${{ matrix.python == '3.9' && 'ubuntu-24.04' || 'ubuntu-26.04' }}
    name: ${{ matrix.python }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python }}
          check-latest: true
      # --only-deps is supported from pip 26.2 on, which requires Python >=3.10
      - run: pip install -U mypy pytest setuptools build 'tornado>=6.5.8' jinja2 pillow pycurl babel boto3 boto3-stubs argon2-cffi
        id: deps
      - run: mypy --install-types --non-interactive --enable-error-code import-untyped .
      - run: pytest
        if: always() && steps.deps.outcome == 'success'
      - run: python3 -m build
        if: always() && steps.deps.outcome == 'success'
        id: build
      - run: pip install -U dist/*.whl
        if: always() && steps.build.outcome == 'success'
