[build-system]
requires = ["setuptools>=77.0.3"]
build-backend = "setuptools.build_meta"

[project]
name = "motioneye"
dynamic = ["version"]
# sync with .github/workflows/test_python.yml
dependencies = [
  "tornado>=6.5.8",
  "jinja2",
  "pillow",
  "pycurl",
  "babel",
  "boto3",
  "argon2-cffi",
]
requires-python = ">=3.9"
authors = [
  {name = "Calin Crisan", email = "ccrisan@gmail.com"},
  {name = "Jean Michault"},
]
maintainers = [
  {name = "MichaIng", email = "micha@dietpi.com"},
]
description = "motioneye, a multilingual web interface for motion."
readme = "README.md"
license = "GPL-3.0-or-later"
license-files = ["LICENSE"]
keywords = ["motion", "video", "surveillance", "frontend"]
classifiers = [
  "Operating System :: POSIX :: Linux",
  "Programming Language :: Python :: 3",
  "Topic :: Multimedia :: Video :: Capture",
]

[project.urls]
Homepage = "https://github.com/motioneye-project/motioneye"
Source = "https://github.com/motioneye-project/motioneye"
Changelog = "https://github.com/motioneye-project/motioneye/releases"
Issue = "https://github.com/motioneye-project/motioneye/issues"

[project.scripts]
meyectl = "motioneye.meyectl:main"
motioneye_init = "motioneye.motioneye_init:main"

[tool.setuptools]
packages = ["motioneye"]
include-package-data = false

[tool.setuptools.package-data]
motioneye = ["extra/*", "static/*.*", "static/*/*", "templates/*", "scripts/*", "controls/*", "handlers/*", "utils/*", "locale/*/LC_MESSAGES/*.mo"]

[tool.setuptools.dynamic]
version = {attr = "motioneye.VERSION"}

[tool.bandit]
# skip hardcoded password, MD5/SHA1 hashes, import subprocess, subprocess.run(..., shell=False)
skips = ["B105", "B324", "B404", "B603"]

[tool.codespell]
ignore-words-list = "ot"
skip = "*.html,*.js,*.json,*.po,*.pot"

[tool.ruff]
builtins = ["_"]
target-version = "py39"

[tool.ruff.format]
quote-style = "preserve"

[tool.ruff.lint]
# C901 and E501 as flake8 had them, I as isort, UP as pyupgrade
# flake8-return rules to add later: RET501 to RET508
extend-select = ["C901", "E501", "I", "UP"]
ignore = ["E722", "LOG015", "BLE001"]

[tool.ruff.lint.mccabe]
max-complexity = 68

[tool.ruff.lint.pycodestyle]
# only for E501, the formatter keeps its own line length
max-line-length = 125
